<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" preserveAspectRatio="none">
  <defs>
    <filter id="deckle" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- Soft worn-sheet silhouette (for optional mask / border-image experiments) -->
  <rect x="16" y="16" width="568" height="768" rx="8" ry="10" fill="#ffffff" filter="url(#deckle)"/>
</svg>
